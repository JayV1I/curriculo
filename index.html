<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Currículo — João Vitor (JayVi)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #e0e0e0;
    color: #000000;
    font-family: 'Georgia', serif;
    min-height: 100vh;
  }
  header {
    background: #000000;
    color: #ffffff;
    padding: 20px 24px 16px;
    text-align: center;
    border-bottom: 6px solid #000000;
  }
  header h1 { font-size: 26px; letter-spacing: 2px; }
  header p { font-size: 14px; color: #888888; margin-top: 6px; letter-spacing: 1px; font-weight: bold; }
  .toolbar {
    background: #1a1a1a;
    text-align: center;
    padding: 15px 10px;
    border-bottom: 4px solid #000000;
  }
  .toolbar a, .toolbar button {
    display: inline-block;
    background: #ffffff;
    color: #000000;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 4px;
    font-weight: bold;
    font-size: 15px;
    margin: 4px 6px;
    border: 3px solid #000000;
    cursor: pointer;
    font-family: 'Georgia', serif;
    box-shadow: 4px 4px 0 #000000;
    transition: all 0.1s;
  }
  .toolbar a:hover, .toolbar button:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 #000000; }
  .lang-btn.active {
    background: #000000;
    color: #ffffff;
    border-color: #888888;
  }
  .paper {
    max-width: 950px;
    margin: 30px auto;
    background: #ffffff;
    border: 5px solid #000000;
    box-shadow: 12px 12px 0 rgba(0,0,0,0.2);
    padding: 10px;
  }
  iframe {
    width: 100%;
    height: 1100px;
    border: none;
  }
  footer {
    text-align: center;
    padding: 30px;
    color: #333333;
    font-size: 15px;
    font-weight: bold;
  }
</style>
</head>
<body>
  <header>
    <h1>JOÃO VITOR — JAYVI 🎞️</h1>
    <p>ANALISTA DE DADOS E I.A · CIÊNCIA DE DADOS — PUC CAMPINAS · CCI GRIS</p>
  </header>
  <div class="toolbar">
    <button class="lang-btn active" data-lang="pt" onclick="trocarIdioma('pt')">🇧🇷 Português</button>
    <button class="lang-btn" data-lang="en" onclick="trocarIdioma('en')">🇺🇸 English</button>
    <a href="Curriculo_JoaoVitor_PTBR.pdf" target="_blank" rel="noopener">⬇️ Baixar PDF</a>
    <a href="https://github.com/JayV1I" target="_blank" rel="noopener">⭐ GitHub</a>
    <a href="https://jayv1i.github.io/JayV1I/" rel="noopener">🏠 Voltar ao Estúdio</a>
  </div>
  <div class="paper">
    <iframe id="cv-frame" src="Curriculo_JoaoVitor_PTBR.pdf" title="Currículo de João Vitor"></iframe>
  </div>
  <footer>
    Desenhado à mão em preto e branco • Est. 2026 • @JayV1I
  </footer>
  <script>
    function trocarIdioma(lang) {
      var frame = document.getElementById('cv-frame');
      if (lang === 'pt') {
        frame.src = 'Curriculo_JoaoVitor_PTBR.pdf';
      } else {
        frame.src = 'Curriculo_JoaoVitor_EN.pdf';
      }
      document.querySelectorAll('.lang-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
    }
  </script>
</body>
</html>
